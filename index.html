<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<meta name="description" content="本地血糖记录工具：录入、时间线、趋势、报告。数据只保存在本机浏览器。">
<title>血糖记录 · GlucoLog</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%A9%B8%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1b2430; --muted:#67727f; --line:#e5e9ef;
  --accent:#2f6fed;
  --ok:#2f9e63; --ok-bg:#e6f5ec;
  --high:#e8792b; --high-bg:#fdf0e3;
  --low:#d64545; --low-bg:#fde9e9;
  --lowish:#b7791f; --lowish-bg:#fdf4d8;
  --grid:#eceff4; --line-strong:#c9d1dc;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101319; --card:#181c24; --ink:#e9edf3; --muted:#9aa4b2; --line:#262c37;
    --accent:#5b8def;
    --ok:#3fbf7d; --ok-bg:#16301f;
    --high:#f08c3a; --high-bg:#33220f;
    --low:#e86a6a; --low-bg:#331a1a;
    --lowish:#d8a64a; --lowish-bg:#332a12;
    --grid:#232936; --line-strong:#3a4353;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;padding-bottom:84px;max-width:640px;margin:0 auto}
body.sheet-open{overflow:hidden}
h1,h2,h3{margin:0;font-weight:600}
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:17px}
main{padding:12px 14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card-title{font-weight:600;margin-bottom:8px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.center{text-align:center}
button{font:inherit;color:inherit;border:1px solid transparent;background:none;cursor:pointer;touch-action:manipulation}
.btn-accent{background:var(--accent);color:#fff;border-radius:999px;padding:8px 16px;font-weight:600}
.btn-ghost{border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted);background:var(--card)}
.btn-ghost.danger{color:var(--low);border-color:var(--low)}
.block{display:block;width:100%;margin-top:8px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;background:var(--card);color:var(--ink);margin:3px 4px 3px 0}
.chip.on{border-color:var(--accent);background:var(--accent);color:#fff}
.chip-wrap{display:flex;flex-wrap:wrap;margin:2px -4px}
.st-ok{color:var(--ok)} .st-high{color:var(--high)} .st-low{color:var(--low)} .st-lowish{color:var(--lowish)}
.pill{display:inline-flex;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;vertical-align:middle}
.pill.st-ok{background:var(--ok-bg)} .pill.st-high{background:var(--high-bg)}
.pill.st-low{background:var(--low-bg)} .pill.st-lowish{background:var(--lowish-bg)}
.bigval{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.unit{font-size:15px;color:var(--muted);font-weight:600;margin-left:4px}
.statline{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;text-align:center}
.statline .v{font-weight:700;font-variant-numeric:tabular-nums}
.statline .k{font-size:11.5px;color:var(--muted)}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.metric{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.metric .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.metric .k{font-size:12px;color:var(--muted)}
.day-head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px 6px;font-weight:600;font-size:14px}
.day-head .m{margin-left:8px;font-size:12.5px;color:var(--muted);font-weight:400}
.log-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.log-item:last-child{border-bottom:none}
.log-val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;min-width:72px}
.log-meta{flex:1;min-width:0}
.log-tags{margin-top:3px;display:flex;flex-wrap:wrap;gap:2px}
.log-note{color:var(--muted);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.log-act{display:flex;gap:2px}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--muted);font-size:15px}
.icon-btn:active{background:var(--bg)}
#tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:640px;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;border-radius:10px}
#tabbar button svg{width:22px;height:22px}
#tabbar button.active{color:var(--accent);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
#onboard{align-items:center;overflow-y:auto;padding:16px 0}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-panel{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease}
#onboard .sheet-panel{max-width:480px;border-radius:18px;margin:auto 14px;max-height:none}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kp button{height:54px;font-size:22px;font-weight:600;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.kp button:active{background:var(--line)}
.kp .k-back{color:var(--muted);font-size:16px}
.field{margin:10px 0}
.field>label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=number],input[type=datetime-local],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:7px 16px;font-weight:600;color:var(--muted);background:var(--card)}
.seg button.on{background:var(--accent);color:#fff}
.targets-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.targets-row span{font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px}
table.hm{border-collapse:separate;border-spacing:3px;width:100%;font-size:12px}
.hm th{color:var(--muted);font-weight:600;padding:2px}
.hm td{text-align:center;border-radius:8px;padding:6px 2px;background:var(--bg);font-variant-numeric:tabular-nums}
.hm td.ok{background:var(--ok-bg);color:var(--ok)} .hm td.high{background:var(--high-bg);color:var(--high)}
.hm td.low{background:var(--low-bg);color:var(--low)} .hm td.lowish{background:var(--lowish-bg);color:var(--lowish)}
.hm td .n{display:block;font-size:10.5px;color:var(--muted)}
.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.acc>button{width:100%;text-align:left;padding:11px 12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;background:var(--bg)}
.acc .acc-body{padding:2px 12px 12px;color:var(--muted);font-size:13.5px}
.acc .arrow{transition:transform .15s}
.acc.open .arrow{transform:rotate(180deg)}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13.5px}
.banner.warn{background:var(--lowish-bg);color:var(--lowish)}
.banner.info{background:var(--ok-bg);color:var(--ok)}
canvas{width:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:14px;z-index:60;max-width:80vw;text-align:center}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.empty .e{font-size:30px;margin-bottom:6px}
.med-btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:12px;padding:11px;color:var(--muted);margin-top:8px;font-weight:600}
.med-btn.done{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.recall-tip{font-size:12px;color:var(--muted);margin-top:4px}
/* AI 问诊 */
.chat-box{display:flex;flex-direction:column;gap:10px;min-height:200px;max-height:52vh;overflow-y:auto;padding:6px 2px}
.chat-msg{max-width:92%}
.chat-msg .who{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.chat-msg .body{white-space:pre-wrap;word-break:break-word;padding:9px 12px;border-radius:12px;font-size:14.5px}
.chat-msg.user{align-self:flex-end}
.chat-msg.user .who{text-align:right}
.chat-msg.user .body{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.chat-msg.ai{align-self:flex-start}
.chat-msg.ai .body{background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-msg.err .body{background:var(--low-bg);color:var(--low)}
details.refs{margin-top:6px;font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;background:var(--bg)}
details.refs summary{cursor:pointer}
.ref-item{margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.ref-item .q{color:var(--ink);font-weight:600}
.chat-form{display:flex;gap:8px;margin-top:10px}
.chat-form input{flex:1;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.chat-form input:focus{outline:none;border-color:var(--accent)}
.chat-form button{border-radius:10px;padding:10px 16px}
.chat-form button:disabled{opacity:.5}
.print-only{display:none}
@media print{
  body{background:#fff;max-width:none;padding:0;font-size:13px}
  body.print-mode #topbar,body.print-mode #tabbar,body.print-mode #toast{display:none!important}
  .no-print{display:none!important}
  .print-only{display:block}
  #view{padding:0}
  .card{box-shadow:none;break-inside:avoid;border-color:#ccc}
  .print-only h1{font-size:22px}
  .print-only hr{border:none;border-top:1px solid #999;margin:8px 0 14px}
}
</style>
</head>
<body>
<header id="topbar">
  <div class="brand">🩸 血糖记录</div>

<main id="view"></main>
<nav id="tabbar">

  <div class="sheet-panel" id="sheetPanel"></div>

<script>
'use strict';
/* ---------- 工具函数 ---------- */
const $=(s)=>document.querySelector(s);
const $$=(s)=>Array.from(document.querySelectorAll(s));
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=(n)=>(n<10?'0':'')+n;
const DAY=86400000;
const dateKey=(ts)=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const startOfDay=(ts)=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime();};
const toLocalInput=(ts)=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());};
const fromLocalInput=(s)=>{const t=new Date(s).getTime();return isNaN(t)?NaN:t;};
const fmtTime=(ts)=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());};
const fmtMD=(ts)=>{const d=new Date(ts);return (d.getMonth()+1)+'月'+d.getDate()+'日';};
const WEEKCN=['日','一','二','三','四','五','六'];
const fmtDay=(ts)=>{const d=new Date(ts);return fmtMD(ts)+' 周'+WEEKCN[d.getDay()];};
const agoText=(ts)=>{const diff=Date.now()-ts;if(diff<60000)return '刚刚';if(diff<3600000)return Math.floor(diff/60000)+' 分钟前';if(diff<DAY)return Math.floor(diff/3600000)+' 小时前';if(diff<7*DAY)return Math.floor(diff/DAY)+' 天前';return fmtMD(ts);};
const cssVar=(n,f)=>{try{const v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||f;}catch(e){return f;}};
/* ---------- 常量 ---------- */
const TAG_META=[
  {id:'fast',label:'空腹',type:'fast'},{id:'bf',label:'早餐后',type:'post'},
  {id:'lb',label:'午餐前',type:'pre'},{id:'ln',label:'午餐后',type:'post'},
  {id:'db',label:'晚餐前',type:'pre'},{id:'dn',label:'晚餐后',type:'post'},
  {id:'bed',label:'睡前',type:'other'},{id:'night',label:'夜间',type:'other'},
  {id:'rand',label:'随机',type:'other'}
];
const tagById=(id)=>TAG_META.find(t=>t.id===id)||TAG_META[8];
const CTX_TAGS=[['rice','主食多'],['light','主食少'],['sport','运动了'],['med','已服药'],['alcohol','饮酒'],['sick','生病'],['stress','压力大'],['period','经期']];
const ctxLabel=(id)=>{const f=CTX_TAGS.find(c=>c[0]===id);return f?f[1]:id;};
const SOURCES=['指尖血','体检','连续监测','其他'];
const MGL=18.0182;
/* ---------- 状态与存储 ---------- */
const KEY='glucolog.v1';
function defaults(){return {unit:'mmol',name:'',dxYear:'',medNote:'',targets:{fastLo:4.4,fastHi:7.0,postHi:10.0,hypo:3.9},reminders:{fast:true,post:true},lastBackup:0,onboarded:false,ai:{key:'',base:'',model:''},aiResult:null,workerUrl:'',kbUrl:'med-kb.json',chat:[],readings:[],metas:[],medDays:{}};}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const o=JSON.parse(raw);
      const d=defaults();
      const s=Object.assign(d,o,{targets:Object.assign(d.targets,o.targets||{}),reminders:Object.assign(d.reminders,o.reminders||{})});
      if(!Array.isArray(s.readings))s.readings=[];
      if(!Array.isArray(s.metas))s.metas=[];
      if(!s.medDays)s.medDays={};
      if(!Array.isArray(s.chat))s.chat=[];
      s.readings.sort((a,b)=>a.ts-b.ts);
      return s;
    }
  }catch(e){console.warn('load',e);}
  return defaults();
}
let S=load();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){toast('保存失败：浏览器存储空间不足');}
}
/* ---------- 单位与状态 ---------- */
function fmtVal(v){return S.unit==='mgdl'?String(Math.round(v*MGL)):(+v).toFixed(1);}
function dispUnit(){return S.unit==='mgdl'?'mg/dL':'mmol/L';}
function parseVal(str,u){if(!/^[0-9.]+$/.test(str))return null;const n=parseFloat(str);if(!isFinite(n)||n<=0)return null;const v=(u==='mgdl')?n/MGL:n;if(v<0.3||v>45)return null;return v;}
function statusOf(v,type){
  const T=S.targets;
  if(v<T.hypo)return 'low';
  if(type==='fast'){if(v<T.fastLo)return 'lowish';if(v>T.fastHi)return 'high';return 'ok';}
  if(type==='post'){if(v>T.postHi)return 'high';return 'ok';}
  if(v>7.8)return 'high';
  if(v<4.4)return 'lowish';
  return 'ok';
}

function heatmapHTML(from){
  const cols=[['fast','空腹','fast'],['bf','早餐后','post'],['ln','午餐后','post'],['dn','晚餐后','post'],['bed','睡前','other']];

      const m=cell.s/cell.n;
      const st=statusOf(m,c[2]);
      h+='<td class="'+st+'">'+fmtVal(m)+'<span class="n">'+cell.n+' 次</span></td>';

function dailyMeans(type){
  const map=new Map();
  S.readings.forEach(r=>{
    if(tagById(r.tag).type!==type)return;
    const k=dateKey(r.ts);
    let e=map.get(k);
    if(!e){e={ts:startOfDay(r.ts),s:0,n:0};map.set(k,e);}
    e.s+=r.v;e.n++;
  });
  const out=[];
  map.forEach(e=>out.push({ts:e.ts,v:e.s/e.n}));
  out.sort((a,b)=>a.ts-b.ts);
  return out;
}
/* ---------- Canvas 图表 ---------- */
const ST_HEX={low:'#d64545',lowish:'#b7791f',ok:'#2f9e63',high:'#e8792b'};
function setupCanvas(cv,h){
  if(!cv)return null;
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth||(cv.parentElement&&cv.parentElement.clientWidth)||300;
  cv.width=Math.max(10,w*dpr);cv.height=Math.max(10,h*dpr);
  const ctx=cv.getContext('2d');
  if(!ctx)return null;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx:ctx,w:w,h:h};
}
function drawLineChart(cv,list,o){
  const c=setupCanvas(cv,o.height||240);
  if(!c)return;
  const ctx=c.ctx,w=c.w,h=c.h;
  const padL=o.noAxis?6:42,padR=8,padT=12,padB=22;
  ctx.clearRect(0,0,w,h);
  if(!list.length){
    ctx.fillStyle=cssVar('--muted','#888');
    ctx.font='13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('暂无数据',w/2,h/2);
    return;
  }
  let vmin=Math.min.apply(null,list.map(r=>r.v));
  let vmax=Math.max.apply(null,list.map(r=>r.v));
  if(o.forceMin!=null)vmin=Math.min(vmin,o.forceMin);
  if(o.forceMax!=null)vmax=Math.max(vmax,o.forceMax);
  vmin=Math.min(vmin,S.targets.hypo-0.3);
  const padV=(vmax-vmin)*0.18||1;
  vmin-=padV;vmax+=padV;
  const t0=list[0].ts,t1=list[list.length-1].ts;
  const X=t=>padL+((t1===t0)?0:(t-t0)/(t1-t0)*(w-padL-padR))+((t1===t0)?(w-padL-padR)/2:0);
  const Y=v=>(h-padB)-(v-vmin)/(vmax-vmin)*(h-padT-padB);
  (o.bands||[]).forEach(b=>{
    ctx.fillStyle=b.color;
    ctx.fillRect(padL,Y(b.hi),w-padL-padR,Math.max(1,Y(b.lo)-Y(b.hi)));
  });
  const yMax=Math.max(0.5,(vmax-vmin)/5);
  const step=Math.max(0.5,Math.ceil(yMax*2)/2);
  ctx.strokeStyle=cssVar('--grid','#eceff4');
  ctx.fillStyle=cssVar('--muted','#888');
  ctx.font='11px sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
  for(let v=Math.ceil(vmin/step)*step;v<=vmax;v+=step){
    const vv=Math.round(v*10)/10;
    ctx.beginPath();ctx.moveTo(padL,Y(vv));ctx.lineTo(w-padR,Y(vv));ctx.stroke();
    if(!o.noAxis)ctx.fillText(o.axisVal?o.axisVal(vv):fmtVal(vv),padL-6,Y(vv));
  }
  (o.lines||[]).forEach(l=>{
    ctx.strokeStyle=l.color;ctx.setLineDash(l.dash||[]);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(padL,Y(l.y));ctx.lineTo(w-padR,Y(l.y));ctx.stroke();
    ctx.setLineDash([]);
  });
  ctx.fillStyle=cssVar('--muted','#888');
  ctx.font='11px sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
  const nT=Math.min(6,Math.max(2,Math.floor((w-padL-padR)/64)));
  if(list.length===1){
    ctx.fillText(o.xLabel(list[0].ts),X(list[0].ts),h-padB+5);
  }else{
    for(let i=0;i<nT;i++){
      const idx=Math.min(list.length-1,Math.round(i*(list.length-1)/(nT-1)));
      ctx.fillText(o.xLabel(list[idx].ts),X(list[idx].ts),h-padB+5);
    }
  }
  ctx.strokeStyle=cssVar('--line-strong','#c9d1dc');ctx.lineWidth=1.5;ctx.beginPath();
  list.forEach((r,i)=>{const x=X(r.ts),y=Y(r.v);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
  ctx.stroke();
  list.forEach(r=>{
    const x=X(r.ts),y=Y(r.v);
    ctx.fillStyle=ST_HEX[stOfReading(r)]||'#999';
    ctx.beginPath();ctx.arc(x,y,3.2,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=cssVar('--card','#fff');ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(x,y,3.2,0,Math.PI*2);ctx.stroke();
  });
}

function buildAnalysis(){
  const from=Date.now()-reportF.range*DAY;

  const list=S.readings.filter(r=>r.ts>=from);
  if(list.length<5){
    return ['记录还不够：再记 '+(5-list.length)+' 次（最好覆盖空腹和餐后 2h），这里就会自动生成分析。'];
  }
  const mean=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length):null;
  const fast=list.filter(r=>tagById(r.tag).type==='fast');
  const post=list.filter(r=>tagById(r.tag).type==='post');
  const okN=list.filter(r=>stOfReading(r)==='ok').length;
  const parts=[];
  parts.push('近 '+days+' 天共记录 '+list.length+' 次，整体达标率 '+Math.round(okN/list.length*100)+'%。');
  if(fast.length){
    const fm=mean(fast.map(r=>r.v));
    const fok=fast.filter(r=>stOfReading(r)==='ok').length;
    let s='空腹平均 '+fmtVal(fm)+' '+dispUnit()+'（'+fast.length+' 次中 '+fok+' 次达标）。';
    if(fm<S.targets.hypo)s+='空腹平均值已到低血糖范围，请尽快就医。';
    else if(fm<S.targets.fastLo)s+='空腹略偏低，注意睡前加餐、避免空腹时间过长。';
    else if(fm>S.targets.fastHi)s+='空腹整体偏高，建议和医生讨论是否需要调整方案。';
    else s+='空腹控制得不错。';
    parts.push(s);
  }
  if(post.length){
    const pm=mean(post.map(r=>r.v));
    const pok=post.filter(r=>stOfReading(r)==='ok').length;
    let s='餐后平均 '+fmtVal(pm)+' '+dispUnit()+'（'+post.length+' 次中 '+pok+' 次达标）。';
    if(pm>S.targets.postHi)s+='餐后偏高较多，可以试试：主食减量或换粗粮、餐后散步 20 分钟、先吃菜和蛋白质再吃主食。';
    else if(pm>S.targets.postHi-1)s+='餐后接近上限，留意每餐的主食量。';
    else s+='餐后控制得不错。';
    parts.push(s);
  }
  const d0=startOfDay(Date.now());
  const meanIn=(a,b,type)=>{const arr=[];S.readings.forEach(r=>{if(r.ts>=a&&r.ts<b&&tagById(r.tag).type===type)arr.push(r.v);});return mean(arr);};
  const fmCur=meanIn(d0-6*DAY,d0+DAY,'fast'),fmPrev=meanIn(d0-13*DAY,d0-6*DAY,'fast');
  if(fmCur!=null&&fmPrev!=null&&Math.abs(fmCur-fmPrev)>=0.5){
    parts.push('空腹近 7 天均值 '+fmtVal(fmCur)+'，比前 7 天（'+fmtVal(fmPrev)+'）'+(fmCur>fmPrev?'升高':'下降')+' '+fmtVal(Math.abs(fmCur-fmPrev))+'。'+(fmCur>fmPrev?'如果持续上升，建议带着记录找医生看看。':'趋势向好，继续保持。'));
  }
  const tagStat={};
  list.forEach(r=>{const k=r.tag;const e=tagStat[k]||(tagStat[k]={n:0,hi:0});e.n++;if(stOfReading(r)==='high')e.hi++;});
  let worst=null;
  Object.keys(tagStat).forEach(k=>{const e=tagStat[k];if(e.n>=3&&(!worst||e.hi/e.n>worst.hi/worst.n))worst={k:k,hi:e.hi,n:e.n};});
  if(worst&&worst.hi>0)parts.push('超标最集中的时段是「'+tagById(worst.k).label+'」（'+worst.hi+'/'+worst.n+' 次超标）。');
  const withRice=list.filter(r=>(r.ctx||[]).indexOf('rice')>=0);
  if(withRice.length>=3){
    const hiR=withRice.filter(r=>stOfReading(r)==='high').length;
    parts.push('标记了「主食多」的 '+withRice.length+' 次记录中 '+hiR+' 次偏高（'+Math.round(hiR/withRice.length*100)+'%）——主食量可能是主要影响因素。');
  }
  const hypo=list.filter(r=>r.v<S.targets.hypo).length;
  if(hypo>0)parts.push('⚠️ 出现 '+hypo+' 次低血糖（<'+fmtVal(S.targets.hypo)+' '+dispUnit()+'）。低血糖比高血糖更危险：随身带糖、查明原因，反复发生要及时就医。');
  let dN=0,dDone=0;
  for(let t=d0-(days-1)*DAY;t<=d0;t+=DAY){dN++;if(S.medDays[dateKey(t)])dDone++;}
  if(dDone>0)parts.push('服药打卡 '+dDone+'/'+dN+' 天（'+Math.round(dDone/dN*100)+'%），坚持按时用药是控糖的基础。');
  if(fast.length>=7&&mean(fast.map(r=>r.v))>S.targets.fastHi+0.5)parts.push('空腹持续高于目标较多，建议近期复诊，带上导出的报告和医生讨论。');
  parts.push('以上是数据规律的客观描述和通用生活方式建议，不构成医疗建议；用药调整请咨询医生。');
  return parts;
}

function bigrams(text){
  const t=String(text).replace(/[^\u4e00-\u9fffA-Za-z0-9]/g,'');
  if(t.length<2)return t?[t]:[];
  const out=[];
  for(let i=0;i<t.length-1;i++)out.push(t.slice(i,i+2));
  return out;
}
function searchLocal(query,topk){
  if(!KB)return [];
  const scores={},seen={};
  bigrams(query).forEach(bg=>{
    if(seen[bg])return;
    seen[bg]=1;
    const ids=KB.idx[bg];
    if(!ids||!ids.length)return;
    const idf=Math.log((KB.n-ids.length+0.5)/(ids.length+0.5)+1.0);
    ids.forEach(i=>{scores[i]=(scores[i]||0)+idf;});
  });
  return Object.keys(scores).map(i=>[i,scores[i]]).sort((a,b)=>b[1]-a[1]).slice(0,topk||3).map(p=>KB.docs[p[0]]);
}

function sendChat(text){
  chatAppend('user',text);

  if(chatHist.length>12)chatHist=chatHist.slice(-12);
  const refs=searchLocal(text,3);
  chatPending();
  fetch((S.workerUrl||'').trim().replace(/\/+$/,'')+'/ask',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({q:text,refs:refs,history:chatHist})
  }).then(r=>r.json()).then(data=>{
    chatPopPending();
    if(data.error){
      chatAppend('ai','出错了：'+data.error,null,true);
    }else{
      chatAppend('ai',data.answer,refs);
      chatHist.push({role:'assistant',content:data.answer});
      if(chatHist.length>12)chatHist=chatHist.slice(-12);
    }
  }).catch(err=>{
    chatPopPending();
    chatAppend('ai','请求失败：'+err+'（请确认 Worker 已部署、网址正确）',null,true);
  });

let addS=null;
function defaultTag(ts){
  const h=new Date(ts).getHours();

  if(h>=14&&h<17)return 'rand';

  return 'night';
}

function updateSheetVal(){
  const el=$('#sheetVal');
  if(!el)return;
  el.textContent=addS.valStr||'—';
  const un=el.nextElementSibling;
  if(un)un.textContent=addS.unitSel==='mgdl'?'mg/dL':'mmol/L';
}
function sheetAddDigit(k){
  if(k==='back'){addS.valStr=addS.valStr.slice(0,-1);}
  else{
    if(k==='.'&&addS.valStr.indexOf('.')>=0)return;
    if(k==='.'&&!addS.valStr)addS.valStr='0';
    const next=addS.valStr+k;
    const parts=next.split('.');
    if(parts[0].length>3)return;
    if(parts.length>1&&parts[1].length>2)return;
    addS.valStr=next;
  }
  updateSheetVal();
}
function saveSheet(again){
  const srcEl=$('#sheetSrc');if(srcEl)addS.src=srcEl.value;
  const nEl=$('#sheetNote');if(nEl)addS.note=nEl.value.trim();
  const v=parseVal(addS.valStr,addS.unitSel);
  if(v==null){toast('请输入有效血糖值');return;}
  const ts=addS.ts;
  if(!isFinite(ts)){toast('时间格式不对');return;}
  if(ts>Date.now()+300000&&!confirm('时间在未来，确定没填错吗？'))return;
  const u=addS.unitSel==='mgdl'?'mg/dL':'mmol/L';
  if(v<2.8&&!confirm('数值很低（<2.8 '+u+'）。低血糖可能危险，请确认数值无误。仍要保存？'))return;
  if(v>25&&!confirm('数值很高（>25 '+u+'）。请确认数值无误，若身体不适请及时就医。仍要保存？'))return;
  const rec={id:addS.editId||('r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),ts:ts,v:v,tag:addS.tag,ctx:addS.ctx.slice(),note:addS.note,src:addS.src,recalled:dateKey(ts)!==dateKey(Date.now())};
  if(addS.editId){const i=S.readings.findIndex(x=>x.id===rec.id);if(i>=0)S.readings[i]=rec;else S.readings.push(rec);}
  else S.readings.push(rec);
  S.readings.sort((a,b)=>a.ts-b.ts||(a.id<b.id?-1:1));
  save();
  closeSheet();
  toast(again?'已保存，继续记下一条':'已保存');
  render();
  if(again){
    const nextTs=Math.min(Date.now(),ts+2*3600000);
    addS={editId:null,valStr:'',unitSel:addS.unitSel,ts:nextTs,tag:defaultTag(nextTs),ctx:addS.ctx.slice(),src:addS.src,note:''};
    renderSheet();
    openSheet();
  }
}

/* ---------- 导入导出 ---------- */
function download(name,content,mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportJSON(){
  S.lastBackup=Date.now();
  save();
  download('血糖记录备份-'+dateKey(Date.now())+'.json',JSON.stringify(S,null,2),'application/json');
  toast('备份已导出');
}
function exportCSV(){
  const head=['日期','时间','血糖_'+dispUnit(),'血糖_mmol/L','血糖_mg/dL','时段','达标情况','情景标签','备注','来源','补录'];
  const rows=S.readings.slice().sort((a,b)=>a.ts-b.ts).map(r=>{
    const st=ST_META[stOfReading(r)].label;
    return [dateKey(r.ts),fmtTime(r.ts),fmtVal(r.v),r.v.toFixed(2),Math.round(r.v*MGL),tagById(r.tag).label,st,(r.ctx||[]).map(ctxLabel).join('、'),r.note||'',r.src||'',r.recalled?'是':'否']
      .map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',');
  });
  const csv='\uFEFF'+head.join(',')+'\n'+rows.join('\n');
  download('血糖记录-'+dateKey(Date.now())+'.csv',csv,'text/csv;charset=utf-8');
  S.lastBackup=Date.now();
  save();
  toast('CSV 已导出');
}
function handleImport(input){
  const f=input.files&&input.files[0];
  if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const o=JSON.parse(rd.result);
      if(!o||!Array.isArray(o.readings)){toast('文件格式不对');return;}
      if(!confirm('导入会用备份文件的内容覆盖当前全部数据，确定继续？'))return;
      const d=defaults();
      S=Object.assign(d,o,{targets:Object.assign(d.targets,o.targets||{}),reminders:Object.assign(d.reminders,o.reminders||{})});
      if(!Array.isArray(S.readings))S.readings=[];
      if(!Array.isArray(S.metas))S.metas=[];
      if(!S.medDays)S.medDays={};
      S.readings.sort((a,b)=>a.ts-b.ts);
      S.lastBackup=Date.now();
      S.onboarded=true;
      save();
      render();
      toast('已恢复');
    }catch(err){toast('无法读取该文件');}
  };
  rd.readAsText(f);
  input.value='';
}

  switch(a){

      if(confirm('删除这条记录？')){
        S.readings=S.readings.filter(r=>r.id!==el.dataset.id);
        save();render();toast('已删除');
      }
      break;
    case 'sheetClose': closeSheet(); break;
    case 'k': sheetAddDigit(el.dataset.k); break;
    case 'unitSel':
      addS.unitSel=el.dataset.val;
      $$('#sheetPanel [data-action="unitSel"]').forEach(b=>b.classList.toggle('on',b.dataset.val===addS.unitSel));
      updateSheetVal();
      break;
    case 'sTag':
      addS.tag=el.dataset.val;
      $$('#sheetPanel [data-action="sTag"]').forEach(b=>b.classList.toggle('on',b.dataset.val===addS.tag));
      break;
    case 'sCtx': {
      const v=el.dataset.val;
      const i=addS.ctx.indexOf(v);
      if(i>=0)addS.ctx.splice(i,1);else addS.ctx.push(v);
      el.classList.toggle('on');
      break;
    }
    case 'save': saveSheet(false); break;
    case 'saveMore': saveSheet(true); break;
    case 'med': {
      const dk=dateKey(Date.now());
      S.medDays[dk]=!S.medDays[dk];
      save();render();
      break;
    }
    case 'onboardDone': onboardDone(); break;
    case 'obUnit':
      $$('#obUnit button').forEach(b=>b.classList.toggle('on',b===el));
      break;
    case 'unit':
      S.unit=el.dataset.val;
      save();render();
      break;
    case 'json': exportJSON(); break;
    case 'csv': exportCSV(); break;
    case 'import': $('#importFile').click(); break;
    case 'clear': clearAll(); break;
    case 'print':
      document.body.classList.add('print-mode');
      window.print();
      setTimeout(()=>document.body.classList.remove('print-mode'),600);
      break;
    case 'metaSave': saveMeta(); break;
    case 'metaDel':
      S.metas=S.metas.filter(m=>m.id!==el.dataset.id);
      save();render();
      break;
    case 'acc': {
      const body=el.nextElementSibling;
      if(body){body.hidden=!body.hidden;el.closest('.acc').classList.toggle('open',!body.hidden);}
      break;
    }
    case 'gotoLog': go('log'); break;
    case 'chatClear':
      S.chat=[];

      save();render();
      break;
    case 'aiSave': {
      S.ai={base:($('#aiBase').value||'').trim(),model:($('#aiModel').value||'').trim(),key:($('#aiKey').value||'').trim()};

      toast('AI 设置已保存');

    }
    case 'aiTest': {
      const ai=S.ai||{};
      if(!(ai.key&&ai.base&&ai.model)){toast('请先填写并保存设置');break;}
      toast('测试中…');
      aiCall([{role:'user',content:'你好，请只回复「连接成功」四个字。'}]).then(()=>{toast('连接成功');}).catch(err=>{toast('测试失败：'+(err&&err.message?err.message:err));});
      break;
    }
    case 'aiGen': aiGenerate(); break;
    case 'copyAnalysis': {
      const txt=$('#analysisText')?$('#analysisText').textContent:'';
      const done=()=>toast('已复制');
      const fail=()=>{
        const ta=document.createElement('textarea');
        ta.value=txt;document.body.appendChild(ta);ta.select();
        try{document.execCommand('copy');done();}catch(err){toast('复制失败，请长按文字手动复制');}
        ta.remove();
      };
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(fail);
      else fail();
      break;
    }
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='sheetTime'){addS.ts=fromLocalInput(el.value);return;}
  if(el.id==='sheetSrc'){addS.src=el.value;return;}
  if(el.id==='logRange'){logF.range=el.value==='all'?'all':+el.value;render();return;}
  if(el.id==='logTag'){logF.tag=el.value;render();return;}
  if(el.id==='logStatus'){logF.status=el.value;render();return;}
  if(el.id==='trendRange'){trendF.range=+el.value;render();return;}
  if(el.id==='reportRange'){reportF.range=+el.value;render();return;}
  if(el.id==='metaKind'){const v2=$('#metaV2');if(v2)v2.hidden=el.value!=='bp';return;}
  if(el.id==='aiPreset'){const p=el.value;if(p){const parts=p.split('|');const b=$('#aiBase'),m=$('#aiModel');if(b)b.value=parts[0];if(m)m.value=parts[1];}return;}
  if(el.id==='importFile'){handleImport(el);return;}
  if(el.dataset.set)handleSet(el);
});
function handleSet(el){
  const k=el.dataset.set;
  if(k==='remFast'){S.reminders.fast=el.checked;save();return;}
  if(k==='remPost'){S.reminders.post=el.checked;save();return;}
  if(k==='fastLo'||k==='fastHi'||k==='postHi'||k==='hypo'){
    const v=parseFloat(el.value);
    if(isFinite(v)&&v>0&&v<40)S.targets[k]=v;
    save();render();
    return;
  }
  if(k==='name'||k==='dxYear'||k==='medNote'){S[k]=el.value.trim();save();return;}
  if(k==='workerUrl'||k==='kbUrl'){
    S[k]=el.value.trim();
    if(k==='kbUrl'){KB=null;kbState='idle';}
    save();
    return;
  }
}
document.addEventListener('submit',e=>{
  if(e.target&&e.target.id==='chatForm'){
    e.preventDefault();
    if(!askConfigured()){toast('请先在「我的 → AI 问诊」配置 Worker 网址');return;}
    const inp=$('#chatInput');
    const text=inp?(inp.value||'').trim():'';
    if(!text)return;
    if(inp)inp.value='';
    sendChat(text);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();
});
let rzT;
window.addEventListener('resize',()=>{
  clearTimeout(rzT);
  rzT=setTimeout(()=>{if(view==='trends')drawTrends();},150);
});
$('#sheet').addEventListener('click',e=>{
  if(e.target.id==='sheet')closeSheet();
});
/* ---------- 启动 ---------- */
(function init(){
  if(!S.onboarded){showOnboard();renderNav();}
  else render();
})();
</script>
</body>
</html>
